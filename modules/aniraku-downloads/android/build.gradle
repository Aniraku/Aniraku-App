apply plugin: 'expo-module-gradle-plugin'

group = 'expo.modules.anirakudownloads'
version = '1.0.0'

android {
  namespace 'expo.modules.anirakudownloads'

  defaultConfig {
    versionCode 1
    versionName '1.0.0'
  }

  lint {
    abortOnError false
  }
}

dependencies {
  // Runtime okhttp ships with the app (react-native network stack) —
  // the download service shares its TLS fingerprint with playback.
  compileOnly "com.squareup.okhttp3:okhttp:4.12.0"
}
