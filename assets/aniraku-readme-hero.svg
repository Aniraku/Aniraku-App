<svg width="1200" height="520" viewBox="0 0 1200 520" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title description">
  <title id="title">Aniraku — your next anime obsession</title>
  <desc id="description">A neon midnight banner for the Aniraku open-source anime discovery and viewing client.</desc>
  <defs>
    <linearGradient id="bg" x1="34" y1="28" x2="1164" y2="488" gradientUnits="userSpaceOnUse">
      <stop stop-color="#070814"/>
      <stop offset="0.52" stop-color="#121534"/>
      <stop offset="1" stop-color="#170D2B"/>
    </linearGradient>
    <linearGradient id="line" x1="70" y1="410" x2="1122" y2="88" gradientUnits="userSpaceOnUse">
      <stop stop-color="#55D8FF"/>
      <stop offset="0.52" stop-color="#8B7BFF"/>
      <stop offset="1" stop-color="#FF79D1"/>
    </linearGradient>
    <linearGradient id="card" x1="788" y1="88" x2="1122" y2="442" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1E214B" stop-opacity="0.92"/>
      <stop offset="1" stop-color="#11132D" stop-opacity="0.88"/>
    </linearGradient>
    <filter id="blur-xl" x="-120" y="-120" width="1440" height="760" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="72"/>
    </filter>
    <filter id="shadow" x="706" y="40" width="492" height="460" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="22" stdDeviation="20" flood-color="#02030B" flood-opacity="0.48"/>
    </filter>
  </defs>

  <rect width="1200" height="520" rx="34" fill="url(#bg)"/>
  <circle cx="1048" cy="86" r="180" fill="#F75FCA" fill-opacity="0.20" filter="url(#blur-xl)"/>
  <circle cx="188" cy="488" r="210" fill="#42C7FF" fill-opacity="0.16" filter="url(#blur-xl)"/>
  <circle cx="616" cy="266" r="148" fill="#816AFF" fill-opacity="0.13" filter="url(#blur-xl)"/>

  <path d="M-16 430C152 331 260 463 446 384C643 299 736 346 862 254C983 166 1060 185 1220 69" stroke="url(#line)" stroke-width="2.4" stroke-linecap="round" stroke-opacity="0.74"/>
  <path d="M-16 455C152 356 260 488 446 409C643 324 736 371 862 279C983 191 1060 210 1220 94" stroke="url(#line)" stroke-width="1" stroke-linecap="round" stroke-opacity="0.22"/>

  <g fill="#EAF5FF">
    <circle cx="772" cy="62" r="2.2"/><circle cx="816" cy="98" r="1.2"/><circle cx="1098" cy="172" r="1.6"/>
    <circle cx="1065" cy="74" r="1.4"/><circle cx="719" cy="174" r="1.1"/><circle cx="1140" cy="126" r="1"/>
  </g>

  <rect x="74" y="86" width="224" height="34" rx="17" fill="#FFFFFF" fill-opacity="0.08" stroke="#FFFFFF" stroke-opacity="0.16"/>
  <circle cx="97" cy="103" r="5" fill="#75E6FF"/>
  <text x="114" y="108" fill="#D7ECFF" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" letter-spacing="1.5">OPEN SOURCE ANIME CLIENT</text>

  <text x="74" y="194" fill="#F8FAFF" font-family="Arial, Helvetica, sans-serif" font-size="70" font-weight="800" letter-spacing="-2">ANIRAKU</text>
  <text x="76" y="241" fill="#BECAEA" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="600">YOUR NEXT ANIME OBSESSION.</text>
  <text x="76" y="286" fill="#AAB6D1" font-family="Arial, Helvetica, sans-serif" font-size="17">Discover something new. Track your progress. Pick up exactly where you left off.</text>

  <g font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" letter-spacing="1.1">
    <rect x="76" y="330" width="124" height="38" rx="19" fill="#F4F7FF"/>
    <text x="102" y="354" fill="#0A0C1C">DISCOVER</text>
    <rect x="210" y="330" width="106" height="38" rx="19" fill="#FFFFFF" fill-opacity="0.08" stroke="#FFFFFF" stroke-opacity="0.18"/>
    <text x="235" y="354" fill="#DDE8FF">TRACK</text>
    <rect x="326" y="330" width="112" height="38" rx="19" fill="#FFFFFF" fill-opacity="0.08" stroke="#FFFFFF" stroke-opacity="0.18"/>
    <text x="351" y="354" fill="#DDE8FF">STREAM</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="744" y="70" width="382" height="378" rx="26" fill="url(#card)" stroke="#FFFFFF" stroke-opacity="0.18"/>
    <rect x="766" y="92" width="338" height="186" rx="18" fill="#0D1026"/>
    <rect x="766" y="92" width="338" height="186" rx="18" fill="url(#line)" fill-opacity="0.24"/>
    <path d="M766 245C836 204 881 294 949 248C1014 205 1044 226 1104 166V278H766V245Z" fill="#080A19" fill-opacity="0.58"/>
    <circle cx="935" cy="185" r="30" fill="#F8FAFF" fill-opacity="0.92"/>
    <path d="M928 169L952 185L928 201V169Z" fill="#151835"/>

    <rect x="766" y="298" width="216" height="12" rx="6" fill="#F4F7FF" fill-opacity="0.92"/>
    <rect x="766" y="320" width="160" height="8" rx="4" fill="#9BA8C9" fill-opacity="0.76"/>
    <rect x="766" y="352" width="338" height="4" rx="2" fill="#FFFFFF" fill-opacity="0.12"/>
    <rect x="766" y="352" width="207" height="4" rx="2" fill="url(#line)"/>
    <circle cx="973" cy="354" r="6" fill="#F5F8FF"/>

    <rect x="766" y="382" width="98" height="34" rx="17" fill="#FFFFFF" fill-opacity="0.1"/>
    <text x="788" y="404" fill="#E6F3FF" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700">AUTO SKIP</text>
    <rect x="878" y="382" width="126" height="34" rx="17" fill="#FFFFFF" fill-opacity="0.1"/>
    <text x="901" y="404" fill="#E6F3FF" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700">CONTINUE</text>
    <circle cx="1080" cy="399" r="9" fill="#75E6FF"/>
  </g>

  <text x="76" y="469" fill="#8D9BBE" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="600" letter-spacing="1.2">DESIGNED FOR THE BINGE. BUILT IN THE OPEN.</text>
</svg>
