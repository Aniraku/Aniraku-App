name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-build:
    name: Lint + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # SEC-01 guard: middleware.js is bundled as an ES module by Vercel;
      # undeclared variables crash it for crawlers only. no-undef catches that.
      - run: npx eslint middleware.js
      - run: npm run lint
      - run: npm run build

  bot-smoke:
    name: Bot-UA smoke test (production)
    runs-on: ubuntu-latest
    # Deployed post-merge only; for PRs the middleware is tested locally below.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: lint-and-build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm run test:bots
        env:
          SMOKE_TEST_BASE_URL: ${{ secrets.SMOKE_TEST_BASE_URL || 'https://www.aniraku.tech' }}
