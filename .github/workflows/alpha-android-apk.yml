name: Build Aniraku v4.2.1 APK

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish the verified v4.2.1 APK as the standard GitHub release
        required: true
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build-stable-apk:
    name: Build universal Android stable APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      RELEASE_TAG: v4.2.1
      RELEASE_VERSION: 4.2.1
      RELEASE_VERSION_CODE: "23"
      RELEASE_ASSET_NAME: Aniraku-v4.2.1.apk
      EXPO_PUBLIC_API_BASE_URL: https://api.aniraku.tech
      EXPO_PUBLIC_ANILIST_GRAPHQL_URL: https://graphql.anilist.co
      EXPO_PUBLIC_SUPABASE_URL: https://sbjdrjaovcgvttfnpfsz.supabase.co
      EXPO_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_-Ht3PZpNy_a35hOI8w1G8g_vwOhAPgS
    steps:
      - name: Check out release source
        uses: actions/checkout@v4
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate native source
        run: pnpm check && pnpm test
      - name: Verify v4.2.1 release identity
        run: |
          pnpm exec expo config --json > /tmp/aniraku-expo-config.json
          grep -q "\"version\": \"$RELEASE_VERSION\"" /tmp/aniraku-expo-config.json
          grep -q "\"versionCode\": $RELEASE_VERSION_CODE" /tmp/aniraku-expo-config.json
      - name: Generate Android project
        run: pnpm exec expo prebuild --platform android --non-interactive --no-install
      - name: Build universal APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon
      - name: Verify packaged JavaScript and ARM libraries
        working-directory: android
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          test -f "$APK"
          unzip -t "$APK"
          unzip -l "$APK" | grep -q 'assets/index.android.bundle'
          unzip -l "$APK" | grep -q 'lib/arm64-v8a/'
          unzip -l "$APK" | grep -q 'lib/armeabi-v7a/'
      - name: Upload Aniraku v4.2.1 APK
        uses: actions/upload-artifact@v4
        with:
          name: Aniraku-${{ env.RELEASE_TAG }}-universal-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
      - name: Publish stable v4.2.1 release
        if: ${{ inputs.publish_release }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          RELEASE_APK=/tmp/$RELEASE_ASSET_NAME
          cp "$APK" "$RELEASE_APK"
          cat > /tmp/aniraku-v4.2.1-notes.md <<'EOF'
          ## Aniraku v4.2.1

          **Package:** `aniraku.anime.app` · **versionCode:** 23

          ### Safer, clearer playback
          - Adds a patient late-provider discovery window so slower servers can appear without discarding providers already found.
          - Treats Ally as a fallback: it stays available only when it is the only source-bearing provider, while existing playback is never interrupted.
          - Adds source-backed quality choices for Auto providers, preserving Auto by default and never inventing unsupported resolutions.
          - Adds an expandable Playback Status panel with provider, delivery path, selected quality, and playable-buffer visibility.
          - Tightens embedded-player popup and redirect controls while preserving supported fullscreen playback. Provider-served video advertising cannot be guaranteed removable.

          ### Updates and everyday improvements
          - Adds an optional direct-distribution update prompt and a manual update check in Settings.
          - Adds unread filtering and Mark All Read for Library alerts, recent local search continuity, and clearer offline-download eligibility messages.
          - Retains the 120-second time-priority stream reserve, direct → proxy → verified embed routing, AniSkip, fullscreen, downloads, synchronization, and Android 9+ ARM32 + ARM64 support.

          > If you are upgrading from v1.x under `aniraku.anine.app`, uninstall that legacy package first. Android treats `aniraku.anime.app` as a separate application.
          EOF
          if gh release view "$RELEASE_TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$RELEASE_APK" --repo "${{ github.repository }}" --clobber
            gh release edit "$RELEASE_TAG" \
              --repo "${{ github.repository }}" \
              --title "v4.2.1 — Safer Playback Control" \
              --notes-file /tmp/aniraku-v4.2.1-notes.md \
              --latest
          else
            gh release create "$RELEASE_TAG" "$RELEASE_APK" \
              --repo "${{ github.repository }}" \
              --title "v4.2.1 — Safer Playback Control" \
              --notes-file /tmp/aniraku-v4.2.1-notes.md \
              --latest
          fi
