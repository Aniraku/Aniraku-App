name: Build Aniraku v4.6 APK

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish the verified v4.6 APK as the standard GitHub release
        required: true
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build-stable-apk:
    name: Build universal Android stable APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      RELEASE_TAG: v4.6
      RELEASE_VERSION: "4.6"
      RELEASE_VERSION_CODE: "41"
      RELEASE_ASSET_NAME: Aniraku-v4.6.apk
      EXPO_PUBLIC_API_BASE_URL: https://api.aniraku.tech
      EXPO_PUBLIC_ANILIST_GRAPHQL_URL: https://graphql.anilist.co
      EXPO_PUBLIC_SUPABASE_URL: https://sbjdrjaovcgvttfnpfsz.supabase.co
      EXPO_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_-Ht3PZpNy_a35hOI8w1G8g_vwOhAPgS
    steps:
      - name: Check out release source
        uses: actions/checkout@v4
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate native source
        env:
          EXPO_PUBLIC_GIPHY_API_KEY: ${{ secrets.EXPO_PUBLIC_GIPHY_API_KEY }}
        run: pnpm check && pnpm test
      - name: Verify v4.6 release identity
        run: |
          pnpm exec expo config --json > /tmp/aniraku-expo-config.json
          grep -Eq "\"version\"[[:space:]]*:[[:space:]]*\"$RELEASE_VERSION\"" /tmp/aniraku-expo-config.json
          grep -Eq "\"versionCode\"[[:space:]]*:[[:space:]]*$RELEASE_VERSION_CODE([,}])" /tmp/aniraku-expo-config.json
      - name: Generate Android project
        run: pnpm exec expo prebuild --platform android --non-interactive --no-install
      - name: Build universal APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon
      - name: Verify packaged JavaScript, ARM libraries, and checksum
        working-directory: android
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          test -f "$APK"
          unzip -t "$APK"
          unzip -l "$APK" | grep -q 'assets/index.android.bundle'
          unzip -l "$APK" | grep -q 'lib/arm64-v8a/'
          unzip -l "$APK" | grep -q 'lib/armeabi-v7a/'
          sha256sum "$APK" | tee /tmp/aniraku-release.apk.sha256
      - name: Upload Aniraku v4.6 APK
        uses: actions/upload-artifact@v4
        with:
          name: Aniraku-${{ env.RELEASE_TAG }}-universal-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
      - name: Publish stable v4.6 release
        if: ${{ inputs.publish_release }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          RELEASE_APK=/tmp/$RELEASE_ASSET_NAME
          RELEASE_DIGEST=/tmp/$RELEASE_ASSET_NAME.sha256
          cp "$APK" "$RELEASE_APK"
          cp /tmp/aniraku-release.apk.sha256 "$RELEASE_DIGEST"
          cat > /tmp/aniraku-v4.6-notes.md <<'EOF'
          ## Aniraku v4.6

          **Package:** `aniraku.anime.app` · **versionCode:** 41

          ### Future-release protection
          - Confirmed upcoming episodes, next-airing releases, and not-yet-released movies stop before provider or stream requests begin.
          - Watch shows the dedicated future-release message without a retry action; already released titles retain normal playback recovery.

          ### Aniraku API episode metadata
          - Anime Detail, Episode Info, Watch, and episode-release alerts use the existing `api.aniraku.tech/api/v1/anime/:id/episodes` contract as their only episode metadata source.
          - The app no longer calls Miruro directly or uses a Miruro episode fallback.
          - If Aniraku’s endpoint is unavailable or malformed, the app presents its existing truthful episode error state rather than inventing an episode list.

          ### Schedule
          - The native Schedule begins with Today and then shows the next six local calendar days.
          - It lists only confirmed upcoming episodes in that window.

          ### Release integrity
          - The build validates native source, packages both ARM architectures, and includes a SHA-256 sidecar for independent APK verification.

          > If you are upgrading from v1.x under `aniraku.anine.app`, uninstall that legacy package first. Android treats `aniraku.anime.app` as a separate application.
          EOF
          if gh release view "$RELEASE_TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$RELEASE_APK" "$RELEASE_DIGEST" --repo "${{ github.repository }}" --clobber
          gh release edit "$RELEASE_TAG" --repo "${{ github.repository }}" --title "v4.6 — Future Release Protection" --notes-file /tmp/aniraku-v4.6-notes.md --latest
          else
            gh release create "$RELEASE_TAG" "$RELEASE_APK" "$RELEASE_DIGEST" --repo "${{ github.repository }}" --target "$GITHUB_SHA" --title "v4.6 — Future Release Protection" --notes-file /tmp/aniraku-v4.6-notes.md --latest
          fi
