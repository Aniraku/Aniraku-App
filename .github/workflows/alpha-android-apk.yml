name: Build Aniraku v4.5.Beta Preview APK

on:
  workflow_dispatch:
    inputs:
      publish_preview:
        description: Publish the verified v4.5.Beta APK as a GitHub pre-release
        required: true
        default: false
        type: boolean
      metadata_resolver_url:
        description: Optional HTTPS Vercel resolver URL used only as metadata recovery, ending before /api/mal
        required: false
        type: string

permissions:
  contents: write

jobs:
  build-preview-apk:
    name: Build universal Android preview APK
    if: github.ref == 'refs/heads/preview/mal-v4.4.1-beta'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      RELEASE_TAG: v4.5.Beta
      RELEASE_VERSION: "4.5.Beta"
      RELEASE_VERSION_CODE: "32"
      RELEASE_ASSET_NAME: Aniraku-v4.5.Beta-preview.apk
      EXPO_PUBLIC_API_BASE_URL: https://api.aniraku.tech
      EXPO_PUBLIC_ANILIST_GRAPHQL_URL: https://graphql.anilist.co
      EXPO_PUBLIC_METADATA_RESOLVER_URL: ${{ inputs.metadata_resolver_url }}/api/mal
      EXPO_PUBLIC_DIRECT_MAL: "true"
      EXPO_PUBLIC_MAL_CLIENT_ID: ${{ secrets.MAL_CLIENT_ID }}
      EXPO_PUBLIC_SUPABASE_URL: https://sbjdrjaovcgvttfnpfsz.supabase.co
      EXPO_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_-Ht3PZpNy_a35hOI8w1G8g_vwOhAPgS
    steps:
      - name: Check out release source
        uses: actions/checkout@v4
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate native source
        env:
          EXPO_PUBLIC_GIPHY_API_KEY: ${{ secrets.EXPO_PUBLIC_GIPHY_API_KEY }}
          EXPO_PUBLIC_DIRECT_MAL: "false"
          EXPO_PUBLIC_MAL_CLIENT_ID: ""
        run: pnpm check && pnpm test
      - name: Verify native MAL configuration and v4.5.Beta identity
        run: |
          test -n "$EXPO_PUBLIC_MAL_CLIENT_ID"
          if [ -n "${{ inputs.metadata_resolver_url }}" ]; then
            case "$EXPO_PUBLIC_METADATA_RESOLVER_URL" in https://*/api/mal) ;; *) echo "Metadata recovery resolver must be an HTTPS Vercel URL" >&2; exit 1 ;; esac
          fi
          pnpm exec expo config --json > /tmp/aniraku-expo-config.json
          grep -Eq "\"version\"[[:space:]]*:[[:space:]]*\"$RELEASE_VERSION\"" /tmp/aniraku-expo-config.json
          grep -Eq "\"versionCode\"[[:space:]]*:[[:space:]]*$RELEASE_VERSION_CODE([,}])" /tmp/aniraku-expo-config.json
      - name: Generate Android project
        run: pnpm exec expo prebuild --platform android --non-interactive --no-install
      - name: Build universal APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon
      - name: Verify packaged JavaScript, ARM libraries, and checksum
        working-directory: android
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          test -f "$APK"
          unzip -t "$APK"
          unzip -l "$APK" | grep -q 'assets/index.android.bundle'
          unzip -l "$APK" | grep -q 'lib/arm64-v8a/'
          unzip -l "$APK" | grep -q 'lib/armeabi-v7a/'
          sha256sum "$APK" | tee /tmp/aniraku-release.apk.sha256
      - name: Upload Aniraku v4.5.Beta preview APK
        uses: actions/upload-artifact@v4
        with:
          name: Aniraku-${{ env.RELEASE_TAG }}-universal-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
      - name: Publish v4.5.Beta pre-release
        if: ${{ inputs.publish_preview }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          RELEASE_APK=/tmp/$RELEASE_ASSET_NAME
          RELEASE_DIGEST=/tmp/$RELEASE_ASSET_NAME.sha256
          cp "$APK" "$RELEASE_APK"
          cp /tmp/aniraku-release.apk.sha256 "$RELEASE_DIGEST"
          cat > /tmp/aniraku-v4.5-beta-notes.md <<'EOF'
          ## Aniraku v4.5.Beta Preview

          **Package:** `aniraku.anime.app` · **versionCode:** 32

          ### Anime Detail layout
          - Comments now appear after the complete episode selector, so episode selection stays together before the discussion.
          - Related titles remain grouped in compact Story order, Extras, and More related rails using real relationship data.

          ### MAL metadata preview
          - Native discovery and search request public MyAnimeList metadata directly with the app's public client ID, using short-lived caching and request coalescing.
          - Each returned MAL title is mapped through the existing Aniraku metadata API to its verified AniList ID before existing episode, Watch, AniSkip, provider, and playback flows run.
          - The optional Vercel resolver and the current Aniraku API remain metadata recovery paths; production website behavior is unchanged.

          ### Episode availability recovery
          - Anime Detail and Watch keep using the existing Aniraku episode route first.
          - If that route is temporarily unreachable, the app retrieves the title's real numbered Miruro episode list using the resolved AniList ID.
          - This recovery path does not alter provider discovery, stream selection, or Direct → Proxy → Embed playback transport.

          ### Preview boundary
          - This is a pre-release for validation only. It does not replace the public v4.4 stable APK or the production website.
          - This Android preview does not require a publicly exposed Vercel Preview deployment.

          > If you are upgrading from v1.x under `aniraku.anine.app`, uninstall that legacy package first. Android treats `aniraku.anime.app` as a separate application.
          EOF
          if gh release view "$RELEASE_TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$RELEASE_APK" "$RELEASE_DIGEST" --repo "${{ github.repository }}" --clobber
            gh release edit "$RELEASE_TAG" --repo "${{ github.repository }}" --title "v4.5.Beta — MAL Metadata Preview" --notes-file /tmp/aniraku-v4.5-beta-notes.md --prerelease
          else
            gh release create "$RELEASE_TAG" "$RELEASE_APK" "$RELEASE_DIGEST" --repo "${{ github.repository }}" --target "$GITHUB_SHA" --title "v4.5.Beta — MAL Metadata Preview" --notes-file /tmp/aniraku-v4.5-beta-notes.md --prerelease
          fi
