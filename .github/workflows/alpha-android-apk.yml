name: Build Aniraku v4.0 APK

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish the verified v4.0 APK as the standard GitHub release
        required: true
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build-stable-apk:
    name: Build universal Android stable APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      EXPO_PUBLIC_API_BASE_URL: https://api.aniraku.tech
      EXPO_PUBLIC_ANILIST_GRAPHQL_URL: https://graphql.anilist.co
      EXPO_PUBLIC_SUPABASE_URL: https://sbjdrjaovcgvttfnpfsz.supabase.co
      EXPO_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_-Ht3PZpNy_a35hOI8w1G8g_vwOhAPgS
    steps:
      - name: Check out release source
        uses: actions/checkout@v4
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate native source
        run: pnpm check && pnpm test
      - name: Generate Android project
        run: pnpm exec expo prebuild --platform android --non-interactive --no-install
      - name: Build universal APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon
      - name: Verify packaged JavaScript and ARM libraries
        working-directory: android
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          test -f "$APK"
          unzip -t "$APK"
          unzip -l "$APK" | grep -q 'assets/index.android.bundle'
          unzip -l "$APK" | grep -q 'lib/arm64-v8a/'
          unzip -l "$APK" | grep -q 'lib/armeabi-v7a/'
      - name: Upload Aniraku v4.0 APK
        uses: actions/upload-artifact@v4
        with:
          name: Aniraku-v4.0-universal-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
      - name: Publish stable v4.0 release
        if: ${{ inputs.publish_release }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          RELEASE_APK=/tmp/Aniraku-v4.0.apk
          cp "$APK" "$RELEASE_APK"
          cat > /tmp/aniraku-v4.0-notes.md <<'EOF'
          ## Aniraku v4.0

          **Package:** `aniraku.anime.app` · **versionCode:** 18

          ### Bounded sources and smoother large-title playback
          - The compact AUDIO & PROVIDER control now opens a bounded sheet below the player instead of covering the player and Watch content.
          - SUB and DUB controls remain fixed at the top of the sheet, while only dense provider choices scroll.
          - One Piece and other high-episode titles avoid repeated episode-list work on player clock updates; episode rows are memoized and off-screen Android content is clipped.
          - Native playback now targets a 50-second forward buffer and resumes after an 8-second media cushion, while retaining the no-corrective-seek rebuffer continuity policy.

          ### Existing capabilities retained
          - Direct → Aniraku proxy → verified embed playback recovery, in-player quality selection, AniSkip, fullscreen, downloads, AniList and MyAnimeList synchronization, and Android 9+ ARM32 + ARM64 support.
          - Kiwi browser HLS recovery with Auto, 1080p, 720p, and 480p selection remains available on the main Aniraku website.

          > If you are upgrading from v1.x under `aniraku.anine.app`, uninstall that legacy package first. Android treats `aniraku.anime.app` as a separate application.
          EOF
          if gh release view v4.0 --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload v4.0 "$RELEASE_APK" --repo "${{ github.repository }}" --clobber
            gh release edit v4.0 \
              --repo "${{ github.repository }}" \
              --title "v4.0 — Bounded Sources and Smoother Watch" \
              --notes-file /tmp/aniraku-v4.0-notes.md \
              --latest
          else
            gh release create v4.0 "$RELEASE_APK" \
              --repo "${{ github.repository }}" \
              --title "v4.0 — Bounded Sources and Smoother Watch" \
              --notes-file /tmp/aniraku-v4.0-notes.md \
              --latest
          fi
