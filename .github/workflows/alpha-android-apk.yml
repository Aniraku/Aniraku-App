name: Build Aniraku v4.2.4 APK

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish the verified v4.2.4 APK as the standard GitHub release
        required: true
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build-stable-apk:
    name: Build universal Android stable APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      RELEASE_TAG: v4.2.4
      RELEASE_VERSION: 4.2.4
      RELEASE_VERSION_CODE: "26"
      RELEASE_ASSET_NAME: Aniraku-v4.2.4.apk
      EXPO_PUBLIC_API_BASE_URL: https://api.aniraku.tech
      EXPO_PUBLIC_ANILIST_GRAPHQL_URL: https://graphql.anilist.co
      EXPO_PUBLIC_SUPABASE_URL: https://sbjdrjaovcgvttfnpfsz.supabase.co
      EXPO_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_-Ht3PZpNy_a35hOI8w1G8g_vwOhAPgS
    steps:
      - name: Check out release source
        uses: actions/checkout@v4
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate native source
        run: pnpm check && pnpm test
      - name: Verify v4.2.4 release identity
        run: |
          pnpm exec expo config --json > /tmp/aniraku-expo-config.json
          grep -Eq "\"version\"[[:space:]]*:[[:space:]]*\"$RELEASE_VERSION\"" /tmp/aniraku-expo-config.json
          grep -Eq "\"versionCode\"[[:space:]]*:[[:space:]]*$RELEASE_VERSION_CODE([,}])" /tmp/aniraku-expo-config.json
      - name: Generate Android project
        run: pnpm exec expo prebuild --platform android --non-interactive --no-install
      - name: Build universal APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon
      - name: Verify packaged JavaScript, ARM libraries, and checksum
        working-directory: android
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          test -f "$APK"
          unzip -t "$APK"
          unzip -l "$APK" | grep -q 'assets/index.android.bundle'
          unzip -l "$APK" | grep -q 'lib/arm64-v8a/'
          unzip -l "$APK" | grep -q 'lib/armeabi-v7a/'
          sha256sum "$APK" | tee /tmp/aniraku-release.apk.sha256
      - name: Upload Aniraku v4.2.4 APK
        uses: actions/upload-artifact@v4
        with:
          name: Aniraku-${{ env.RELEASE_TAG }}-universal-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
      - name: Publish stable v4.2.4 release
        if: ${{ inputs.publish_release }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          RELEASE_APK=/tmp/$RELEASE_ASSET_NAME
          RELEASE_DIGEST=/tmp/$RELEASE_ASSET_NAME.sha256
          cp "$APK" "$RELEASE_APK"
          cp /tmp/aniraku-release.apk.sha256 "$RELEASE_DIGEST"
          cat > /tmp/aniraku-v4.2.4-notes.md <<'EOF'
          ## Aniraku v4.2.4

          **Package:** `aniraku.anime.app` · **versionCode:** 26

          ### Verified accounts, returned to Aniraku
          - Creating an account now clearly explains that email verification is required before sign-in, names the destination email address, and asks users to check **Spam** or **Junk** if the message is not in the inbox.
          - Supabase email-confirmation and password-recovery callbacks use the registered `aniraku://auth` Android route. The app safely completes either a PKCE code or token-hash callback and returns the user to Aniraku.

          ### Clearer verified direct updates
          - The in-app update sheet now identifies the installed and available versions, labels the release as verified, and names the exact install action before opening Android’s system installer.
          - Updates still validate the official Aniraku GitHub Release asset and expected byte size. `Aniraku-v4.2.4.apk.sha256` is included for independent download verification.

          ### Community support remains available
          - **Profile → Support Me** continues to provide Patreon plus optional USDT on **BNB Smart Chain (BEP20)** with a visible QR, exact network warning, and deliberate copy action.

          > If you are upgrading from v1.x under `aniraku.anine.app`, uninstall that legacy package first. Android treats `aniraku.anime.app` as a separate application.
          EOF
          if gh release view "$RELEASE_TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$RELEASE_APK" "$RELEASE_DIGEST" --repo "${{ github.repository }}" --clobber
            gh release edit "$RELEASE_TAG" --repo "${{ github.repository }}" --title "v4.2.4 — Verified Accounts" --notes-file /tmp/aniraku-v4.2.4-notes.md --latest
          else
            gh release create "$RELEASE_TAG" "$RELEASE_APK" "$RELEASE_DIGEST" --repo "${{ github.repository }}" --title "v4.2.4 — Verified Accounts" --notes-file /tmp/aniraku-v4.2.4-notes.md --latest
          fi
