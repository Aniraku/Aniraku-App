name: Build Aniraku v3.1 APK

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish the verified v3.1 APK as the standard GitHub release
        required: true
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build-stable-apk:
    name: Build universal Android stable APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      EXPO_PUBLIC_API_BASE_URL: https://api.aniraku.tech
      EXPO_PUBLIC_ANILIST_GRAPHQL_URL: https://graphql.anilist.co
      EXPO_PUBLIC_SUPABASE_URL: https://sbjdrjaovcgvttfnpfsz.supabase.co
      EXPO_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_-Ht3PZpNy_a35hOI8w1G8g_vwOhAPgS
    steps:
      - name: Check out release source
        uses: actions/checkout@v4
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate native source
        run: pnpm check && pnpm test
      - name: Generate Android project
        run: pnpm exec expo prebuild --platform android --non-interactive --no-install
      - name: Build universal APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon
      - name: Verify packaged JavaScript and ARM libraries
        working-directory: android
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          test -f "$APK"
          unzip -t "$APK"
          unzip -l "$APK" | grep -q 'assets/index.android.bundle'
          unzip -l "$APK" | grep -q 'lib/arm64-v8a/'
          unzip -l "$APK" | grep -q 'lib/armeabi-v7a/'
      - name: Upload Aniraku v3.1 APK
        uses: actions/upload-artifact@v4
        with:
          name: Aniraku-v3.1-universal-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
      - name: Publish stable v3.1 release
        if: ${{ inputs.publish_release }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          RELEASE_APK=/tmp/Aniraku-v3.1.apk
          cp "$APK" "$RELEASE_APK"
          cat > /tmp/aniraku-v3.1-notes.md <<'EOF'
          ## Aniraku v3.1

          **Package:** `aniraku.anime.app` · **versionCode:** 16

          ### Provider transport refinement
          - Made every valid direct, proxy-verified, and verified embedded source explicitly eligible for provider selection instead of collapsing selection to only native or embedded categories
          - Preserved source order: native direct media first, Aniraku proxy for proxy-verified media second, and verified embeds only when native routes are unavailable
          - Proxy-verified HLS sources now begin through `/api/v1/proxy`, retain their native quality choices, and never get reclassified as embed-only media
          - Kiwi remains visible as a verified embedded provider. Its current live 1080p, 720p, and 360p backend URLs are selectable through the embedded quality control without being forced through the native player

          ### Existing Watch capabilities retained
          - Complete v3.0 provider parity, AniSkip recovery, responsive high-episode paging/search/jump, and selected-episode information navigation
          - Replay-safe native rebuffer recovery, six-second resume cushioning, 45-second forward target, Android direct-media caching, and direct → proxy → verified embed recovery
          - Maximum-quality downloads for eligible HTTPS direct progressive sources, with an in-player Downloads glyph and clear streaming-only eligibility guard
          - Native AniList and MyAnimeList browser linking, explicit library import/export, disconnect, and progress/rating synchronization through the existing Aniraku service
          - Debounced search input, request coalescing, short-lived local cache, and Retry-After-aware 429 recovery

          ### Included product capabilities
          - Native direct-first recovery: direct source → Aniraku proxy → verified embed fallback
          - In-player quality selector, language/provider controls, manual skip overlays, Auto Next, Auto Skip, speed, fullscreen, and 45-second forward preload
          - Android 9+ (API 28+) · ARM32 + ARM64 · FOSS direct install, without Google Play

          > If you are upgrading from v1.x under `aniraku.anine.app`, uninstall that legacy package first. Android treats `aniraku.anime.app` as a separate application.
          EOF
          if gh release view v3.1 --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release delete-asset v3.1 app-release.apk --repo "${{ github.repository }}" --yes || true
            gh release upload v3.1 "$RELEASE_APK" --repo "${{ github.repository }}" --clobber
            gh release edit v3.1 \
              --repo "${{ github.repository }}" \
              --title "v3.1 — Direct, Proxy, and Embed Eligibility" \
              --notes-file /tmp/aniraku-v3.1-notes.md \
              --latest
          else
            gh release create v3.1 "$RELEASE_APK" \
              --repo "${{ github.repository }}" \
              --title "v3.1 — Direct, Proxy, and Embed Eligibility" \
              --notes-file /tmp/aniraku-v3.1-notes.md \
              --latest
          fi
