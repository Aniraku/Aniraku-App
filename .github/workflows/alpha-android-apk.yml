name: Build Aniraku v4.1.1 APK

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish the verified v4.1.1 APK as the standard GitHub release
        required: true
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build-stable-apk:
    name: Build universal Android stable APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      EXPO_PUBLIC_API_BASE_URL: https://api.aniraku.tech
      EXPO_PUBLIC_ANILIST_GRAPHQL_URL: https://graphql.anilist.co
      EXPO_PUBLIC_SUPABASE_URL: https://sbjdrjaovcgvttfnpfsz.supabase.co
      EXPO_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_-Ht3PZpNy_a35hOI8w1G8g_vwOhAPgS
    steps:
      - name: Check out release source
        uses: actions/checkout@v4
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate native source
        run: pnpm check && pnpm test
      - name: Generate Android project
        run: pnpm exec expo prebuild --platform android --non-interactive --no-install
      - name: Build universal APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon
      - name: Verify packaged JavaScript and ARM libraries
        working-directory: android
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          test -f "$APK"
          unzip -t "$APK"
          unzip -l "$APK" | grep -q 'assets/index.android.bundle'
          unzip -l "$APK" | grep -q 'lib/arm64-v8a/'
          unzip -l "$APK" | grep -q 'lib/armeabi-v7a/'
      - name: Upload Aniraku v4.1.1 APK
        uses: actions/upload-artifact@v4
        with:
          name: Aniraku-v4.1.1-universal-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
      - name: Publish stable v4.1.1 release
        if: ${{ inputs.publish_release }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          RELEASE_APK=/tmp/Aniraku-v4.1.1.apk
          cp "$APK" "$RELEASE_APK"
          cat > /tmp/aniraku-v4.1.1-notes.md <<'EOF'
          ## Aniraku v4.1.1

          **Package:** `aniraku.anime.app` · **versionCode:** 20

          ### Critical Anime Detail stability fix
          - Fixed the v4.1 error “Rendered more hooks than during the previous render” when Anime Detail changed from loading to a loaded title.
          - Relationships now initializes on every screen render before loading and error branches, so the native Relations interface remains stable.
          - Added a regression test that prevents the relation memo from being placed after an early render return.

          ### Existing capabilities retained
          - Anime Detail relationship labels and navigation, bounded Audio & Provider controls, provider parity, direct → proxy → verified embed recovery, AniSkip, fullscreen, downloads, list synchronization, and Android 9+ ARM32 + ARM64 support are retained.

          > If you are upgrading from v1.x under `aniraku.anine.app`, uninstall that legacy package first. Android treats `aniraku.anime.app` as a separate application.
          EOF
          if gh release view v4.1.1 --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload v4.1.1 "$RELEASE_APK" --repo "${{ github.repository }}" --clobber
            gh release edit v4.1.1 \
              --repo "${{ github.repository }}" \
              --title "v4.1.1 — Anime Detail Stability Fix" \
              --notes-file /tmp/aniraku-v4.1.1-notes.md \
              --latest
          else
            gh release create v4.1.1 "$RELEASE_APK" \
              --repo "${{ github.repository }}" \
              --title "v4.1.1 — Anime Detail Stability Fix" \
              --notes-file /tmp/aniraku-v4.1.1-notes.md \
              --latest
          fi
