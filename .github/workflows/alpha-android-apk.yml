name: Build Aniraku v3.5 APK

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish the verified v3.5 APK as the standard GitHub release
        required: true
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build-stable-apk:
    name: Build universal Android stable APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      EXPO_PUBLIC_API_BASE_URL: https://api.aniraku.tech
      EXPO_PUBLIC_ANILIST_GRAPHQL_URL: https://graphql.anilist.co
      EXPO_PUBLIC_SUPABASE_URL: https://sbjdrjaovcgvttfnpfsz.supabase.co
      EXPO_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_-Ht3PZpNy_a35hOI8w1G8g_vwOhAPgS
    steps:
      - name: Check out release source
        uses: actions/checkout@v4
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate native source
        run: pnpm check && pnpm test
      - name: Generate Android project
        run: pnpm exec expo prebuild --platform android --non-interactive --no-install
      - name: Build universal APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon
      - name: Verify packaged JavaScript and ARM libraries
        working-directory: android
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          test -f "$APK"
          unzip -t "$APK"
          unzip -l "$APK" | grep -q 'assets/index.android.bundle'
          unzip -l "$APK" | grep -q 'lib/arm64-v8a/'
          unzip -l "$APK" | grep -q 'lib/armeabi-v7a/'
      - name: Upload Aniraku v3.5 APK
        uses: actions/upload-artifact@v4
        with:
          name: Aniraku-v3.5-universal-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
      - name: Publish stable v3.5 release
        if: ${{ inputs.publish_release }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          RELEASE_APK=/tmp/Aniraku-v3.5.apk
          cp "$APK" "$RELEASE_APK"
          cat > /tmp/aniraku-v3.5-notes.md <<'EOF'
          ## Aniraku v3.5

          **Package:** `aniraku.anime.app` · **versionCode:** 17

          ### Watch compatibility upgrade
          - Anime Detail now renders a bounded 50-episode page at a time, with explicit Previous and Next navigation for large catalogs.
          - The native Watch screen retains a compact AUDIO & PROVIDER rail after player controls minimize, so SUB and DUB remain reachable without reopening the controls.
          - Dense provider lists remain inside a bounded source sheet rather than obscuring language selection.
          - The main Aniraku website’s mobile Watch page now keeps episode ratings, navigation, and related outside-player actions within an overflow-safe page flow.

          ### Existing capabilities retained
          - Direct → Aniraku proxy → verified embed playback recovery, in-player quality selection, AniSkip, fullscreen, downloads, AniList and MyAnimeList synchronization, and Android 9+ ARM32 + ARM64 support.
          - Kiwi browser HLS recovery with Auto, 1080p, 720p, and 480p selection remains available on the main Aniraku website.

          > If you are upgrading from v1.x under `aniraku.anine.app`, uninstall that legacy package first. Android treats `aniraku.anime.app` as a separate application.
          EOF
          if gh release view v3.5 --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload v3.5 "$RELEASE_APK" --repo "${{ github.repository }}" --clobber
            gh release edit v3.5 \
              --repo "${{ github.repository }}" \
              --title "v3.5 — Watch Compatibility Upgrade" \
              --notes-file /tmp/aniraku-v3.5-notes.md \
              --latest
          else
            gh release create v3.5 "$RELEASE_APK" \
              --repo "${{ github.repository }}" \
              --title "v3.5 — Watch Compatibility Upgrade" \
              --notes-file /tmp/aniraku-v3.5-notes.md \
              --latest
          fi
