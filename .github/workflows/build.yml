name: Build & Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - arch: arm64-v8a
            label: arm64
          - arch: armeabi-v7a
            label: arm32
          - arch: x86_64
            label: x86_64
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install EAS CLI
        run: pnpm add -g eas-cli

      - name: Set build arch
        run: |
          sed -i 's/buildArchs: \[.*\]/buildArchs: ["${{ matrix.arch }}"]/' app.config.ts

      - name: Build APK
        id: build
        run: |
          BUILD_OUTPUT=$(eas build --profile preview --platform android --non-interactive --wait 2>&1)
          echo "$BUILD_OUTPUT"
          # Extract artifact URL from EAS output
          APK_URL=$(echo "$BUILD_OUTPUT" | grep -oP 'https://[^ ]+\.apk' | head -1)
          if [ -z "$APK_URL" ]; then
            echo "ERROR: Could not find APK URL in EAS output"
            exit 1
          fi
          echo "apk_url=$APK_URL" >> "$GITHUB_OUTPUT"
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          EXPO_PUBLIC_ANILIST_CLIENT_ID: ${{ secrets.EXPO_PUBLIC_ANILIST_CLIENT_ID }}
          EXPO_PUBLIC_ANILIST_GRAPHQL_URL: ${{ secrets.EXPO_PUBLIC_ANILIST_GRAPHQL_URL }}
          EXPO_PUBLIC_API_BASE_URL: ${{ secrets.EXPO_PUBLIC_API_BASE_URL }}
          EXPO_PUBLIC_MAL_CLIENT_ID: ${{ secrets.EXPO_PUBLIC_MAL_CLIENT_ID }}

      - name: Download APK
        run: |
          mkdir -p artifacts
          curl -L -o "aniraku-${{ github.ref_name }}-${{ matrix.label }}.apk" "${{ steps.build.outputs.apk_url }}"

      - uses: actions/upload-artifact@v4
        with:
          name: aniraku-${{ matrix.label }}
          path: aniraku-${{ github.ref_name }}-${{ matrix.label }}.apk

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: ./artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Aniraku ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: ./artifacts/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
