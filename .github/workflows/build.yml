name: Build & Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build (must match the version in app.config.ts)"
        required: false
        default: "v5.6.2"

env:
  RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.label }} APK (${{ github.event.inputs.tag || github.ref_name }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - arch: arm64-v8a
            label: arm64
          - arch: armeabi-v7a
            label: arm32
          - arch: armeabi-v7a,arm64-v8a,x86_64
            label: universal
    steps:
      - uses: actions/checkout@v4

      - name: Verify release tag matches app version
        run: |
          APP_VERSION=$(grep -oE 'version: "[0-9]+\.[0-9]+\.[0-9]+"' app.config.ts | head -1 | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
          echo "App version: $APP_VERSION | Release tag: $RELEASE_TAG"
          test "v$APP_VERSION" = "$RELEASE_TAG" || { echo "ERROR: tag $RELEASE_TAG does not match app version $APP_VERSION in app.config.ts"; exit 1; }

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - run: pnpm install --frozen-lockfile

      - name: Prebuild Android project
        run: npx expo prebuild --platform android --clean
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          EXPO_PUBLIC_ANILIST_CLIENT_ID: ${{ secrets.EXPO_PUBLIC_ANILIST_CLIENT_ID }}
          EXPO_PUBLIC_ANILIST_GRAPHQL_URL: ${{ secrets.EXPO_PUBLIC_ANILIST_GRAPHQL_URL }}
          EXPO_PUBLIC_API_BASE_URL: ${{ secrets.EXPO_PUBLIC_API_BASE_URL }}
          EXPO_PUBLIC_MAL_CLIENT_ID: ${{ secrets.EXPO_PUBLIC_MAL_CLIENT_ID }}

      - name: Build APK (${{ matrix.label }})
        run: |
          cd android
          ./gradlew assembleRelease \
            -PreactNativeArchitectures=${{ matrix.arch }} \
            -PnewArchEnabled=false \
            --no-daemon
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          EXPO_PUBLIC_ANILIST_CLIENT_ID: ${{ secrets.EXPO_PUBLIC_ANILIST_CLIENT_ID }}
          EXPO_PUBLIC_ANILIST_GRAPHQL_URL: ${{ secrets.EXPO_PUBLIC_ANILIST_GRAPHQL_URL }}
          EXPO_PUBLIC_API_BASE_URL: ${{ secrets.EXPO_PUBLIC_API_BASE_URL }}
          EXPO_PUBLIC_MAL_CLIENT_ID: ${{ secrets.EXPO_PUBLIC_MAL_CLIENT_ID }}

      - name: Rename APK
        run: |
          APK=$(find android/app/build/outputs/apk/release -name "*.apk" | head -1)
          cp "$APK" "aniraku-${RELEASE_TAG}-${{ matrix.label }}.apk"
          echo "Built: aniraku-${RELEASE_TAG}-${{ matrix.label }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: aniraku-${{ matrix.label }}
          path: aniraku-${{ env.RELEASE_TAG }}-${{ matrix.label }}.apk

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: ./artifacts
          merge-multiple: true

      - name: List APKs
        run: ls -lh ./artifacts/*.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Aniraku ${{ env.RELEASE_TAG }}
          draft: false
          prerelease: false
          body: |
            ## v5.6.2 — Player Gestures, Downloads & Playback Honesty

            Three builds for full coverage (Android 9+). The universal APK contains all architectures.

            - `aniraku-v5.6.2-arm64.apk`
            - `aniraku-v5.6.2-arm32.apk`
            - `aniraku-v5.6.2-universal.apk`

            ### Player gestures rewritten (zoned state machine)
            - **No more all-at-once triggers**: brightness, volume, 2x hold, and seek each own a screen zone and can never fire together.
            - Outer-left swipe = brightness, outer-right swipe = volume (22px activation, direction-locked).
            - Center hold 550ms = 2x speed — outer zones can never trigger it.
            - Double-tap left/right = −10s/+10s, triple-tap = −20s/+30s totals, center double/triple = play/pause. Seek fires on touch-down, double-tap-and-hold keeps skipping.
            - Single tap toggles controls without flashing on double-taps.

            ### Downloads that match the backend
            - Download icon now opens the backend's real file links: quality picker (1080p/720p/…) when offered, direct open when only a default label exists.
            - Backend links are external pages, so they open in the browser behind a "You're leaving Aniraku" confirmation. SUB and DUB lists stay separate.
            - Legacy in-app save remains as fallback when the backend offers no download links.

            ### Hentai & playback
            - **Hentai embed fallback**: titles with embed-only sources no longer die at server discovery — the player now attempts the stream and mounts the embed inline in the WebView.
            - **No more auto-play/auto-skip**: removed both. Near the finish line a persistent UP NEXT card waits for you — PLAY NOW or dismiss, your call. Manual Skip Intro/Outro buttons unchanged.

            ### Home & search
            - **Notification bell** opens an in-app bottom sheet (unread/all, mark-read) instead of dumping you on the profile page.
            - **VIEW ALL / See all** open filtered search (Trending, Ongoing, Popular, Top Movies, Top in genre, Coming Soon) instead of the plain catalog.

            ### Housekeeping
            - **Android versionCode**: 59.

            Download the APK, install, and allow *install from unknown sources* if prompted.
          files: ./artifacts/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
