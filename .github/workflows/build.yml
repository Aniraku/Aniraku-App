name: Build & Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build (must match the version in app.config.ts)"
        required: false
        default: "v5.7.4"

env:
  RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate (typecheck, lint, tests)
    runs-on: ubuntu-latest
    # Blocking validate gate: typecheck, lint, and tests must pass before the
    # APK build starts (see `needs: validate` on the build job). Verified for
    # Phase I:
    #   - `pnpm install --frozen-lockfile` ✔ (lockfile re-synced after dropping expo-video)
    #   - `pnpm check` ✔ (tsc clean)
    #   - `pnpm lint` ✔ (ESLint 9 config fixed: eslint.config.mjs; 0 errors)
    #   - `pnpm test` ✔ (tests/aniraku-services + aniraku-avatars now skip when
    #     EXPO_PUBLIC_* env is absent; with the secrets below they run as live
    #     smoke probes, so a production endpoint outage will also fail validation)
    continue-on-error: false
    # Live-configuration secrets: with these set, the suite asserts real
    # Supabase/AniList endpoints; without them, those tests skip gracefully.
    env:
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
      EXPO_PUBLIC_ANILIST_CLIENT_ID: ${{ secrets.EXPO_PUBLIC_ANILIST_CLIENT_ID }}
      # Pinned, not secret: metadata ships from Aniraku's offline AniList
      # mirror (same DB, no rate limits). Keeps validate/prebuild/build — and
      # therefore the shipped APK — on the same endpoint as the app default.
      EXPO_PUBLIC_ANILIST_GRAPHQL_URL: "https://graphql.aniraku.tech"
      EXPO_PUBLIC_API_BASE_URL: ${{ secrets.EXPO_PUBLIC_API_BASE_URL }}
      EXPO_PUBLIC_MAL_CLIENT_ID: ${{ secrets.EXPO_PUBLIC_MAL_CLIENT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm check

      - run: pnpm lint

      - run: pnpm test

  build:
    name: Build ${{ matrix.label }} APK (${{ github.event.inputs.tag || github.ref_name }})
    runs-on: ubuntu-latest
    # Gate the release pipeline on validation: without this, flipping
    # continue-on-error on the validate job would not block anything.
    needs: validate
    strategy:
      matrix:
        include:
          - arch: arm64-v8a
            label: arm64
          - arch: armeabi-v7a
            label: arm32
          - arch: armeabi-v7a,arm64-v8a,x86_64
            label: universal
    steps:
      - uses: actions/checkout@v4

      - name: Verify release tag matches app version
        run: |
          APP_VERSION=$(grep -oE 'version: "[0-9]+\.[0-9]+\.[0-9]+"' app.config.ts | head -1 | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
          echo "App version: $APP_VERSION | Release tag: $RELEASE_TAG"
          test "v$APP_VERSION" = "$RELEASE_TAG" || { echo "ERROR: tag $RELEASE_TAG does not match app version $APP_VERSION in app.config.ts"; exit 1; }

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - run: pnpm install --frozen-lockfile

      - name: Prebuild Android project
        run: npx expo prebuild --platform android --clean
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          EXPO_PUBLIC_ANILIST_CLIENT_ID: ${{ secrets.EXPO_PUBLIC_ANILIST_CLIENT_ID }}
          EXPO_PUBLIC_ANILIST_GRAPHQL_URL: "https://graphql.aniraku.tech"
          EXPO_PUBLIC_API_BASE_URL: ${{ secrets.EXPO_PUBLIC_API_BASE_URL }}
          EXPO_PUBLIC_MAL_CLIENT_ID: ${{ secrets.EXPO_PUBLIC_MAL_CLIENT_ID }}

      - name: Build APK (${{ matrix.label }})
        run: |
          cd android
          ./gradlew assembleRelease \
            -PreactNativeArchitectures=${{ matrix.arch }} \
            -PnewArchEnabled=false \
            --no-daemon
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          EXPO_PUBLIC_ANILIST_CLIENT_ID: ${{ secrets.EXPO_PUBLIC_ANILIST_CLIENT_ID }}
          EXPO_PUBLIC_ANILIST_GRAPHQL_URL: "https://graphql.aniraku.tech"
          EXPO_PUBLIC_API_BASE_URL: ${{ secrets.EXPO_PUBLIC_API_BASE_URL }}
          EXPO_PUBLIC_MAL_CLIENT_ID: ${{ secrets.EXPO_PUBLIC_MAL_CLIENT_ID }}

      - name: Rename APK
        run: |
          APK=$(find android/app/build/outputs/apk/release -name "*.apk" | head -1)
          cp "$APK" "aniraku-${RELEASE_TAG}-${{ matrix.label }}.apk"
          echo "Built: aniraku-${RELEASE_TAG}-${{ matrix.label }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: aniraku-${{ matrix.label }}
          path: aniraku-${{ env.RELEASE_TAG }}-${{ matrix.label }}.apk

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: ./artifacts
          merge-multiple: true

      - name: List APKs
        run: ls -lh ./artifacts/*.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Aniraku ${{ env.RELEASE_TAG }}
          draft: false
          prerelease: false
          body: |
            ## v5.7.4 — Gesture controls + Saved list statuses

            Three builds for full coverage (Android 9+). The universal APK contains all architectures.

            - `aniraku-v5.7.4-arm64.apk`
            - `aniraku-v5.7.4-arm32.apk`
            - `aniraku-v5.7.4-universal.apk`

            ### Added
            - **Saved list statuses**: every Saved title now shows its list status (Watching / Plan to Watch / Completed / Paused / Dropped / Rewatching) as a badge in list and grid layouts, plus status filter chips with live counts. New saves start as Plan to Watch.
            - **Automatic status advancement**: watch events move titles Plan to Watch → Watching → Completed (distinct episodes at ≥80%; completion only when the episode total is known). Paused/Dropped stay explicit-only and imported statuses always win.

            ### Improved
            - **Player gestures overhauled** — every reported symptom addressed: a single 300ms tap window now governs the controls toggle, double-tap detection and tap-chain resets so seeks can no longer race the toggle; one unified zone map removes the dead band between the swipe and seek zones; hold-for-2x tolerates normal finger wobble and can no longer get stuck at 2x or leak into the saved speed preference; the gesture responder is created once (no handler swaps under the active touch); brightness/volume swipes use a calmer, even mapping.
            - **Saved view polish**: history-based status fallback for legacy rows, empty-filter state with a CLEAR FILTER action, status included in accessibility labels.

            ### Fixed
            - **Accidental double/triple seeks**: stale tap state left behind by swipes and holds now resets on release and on system interruptions.
            - **Gesture HUD**: one tracked hide timer — no HUD stuck on screen after an interrupted touch, and a previous gesture's timer can no longer clear the HUD mid-swipe.
            - **Triple-tap center** no longer toggles play/pause twice.
            - **Imported "Watching" rows** no longer fall back to an unsaved status (the port rejected canonical `CURRENT`).

            ### Housekeeping
            - 247 tests green (12 new); ESLint 0 errors / 69 warnings (below the 70 baseline).
            - **Android versionCode**: 71.

            Download the APK, install, and allow *install from unknown sources* if prompted.
          files: ./artifacts/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
