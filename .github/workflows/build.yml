name: Build & Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build (must match the version in app.config.ts)"
        required: false
        default: "v5.7.5"

env:
  RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate (typecheck, lint, tests)
    runs-on: ubuntu-latest
    # Blocking validate gate: typecheck, lint, and tests must pass before the
    # APK build starts (see `needs: validate` on the build job). Verified for
    # Phase I:
    #   - `pnpm install --frozen-lockfile` ✔ (lockfile re-synced after dropping expo-video)
    #   - `pnpm check` ✔ (tsc clean)
    #   - `pnpm lint` ✔ (ESLint 9 config fixed: eslint.config.mjs; 0 errors)
    #   - `pnpm test` ✔ (tests/aniraku-services + aniraku-avatars now skip when
    #     EXPO_PUBLIC_* env is absent; with the secrets below they run as live
    #     smoke probes, so a production endpoint outage will also fail validation)
    continue-on-error: false
    # Live-configuration secrets: with these set, the suite asserts real
    # Supabase/AniList endpoints; without them, those tests skip gracefully.
    env:
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
      EXPO_PUBLIC_ANILIST_CLIENT_ID: ${{ secrets.EXPO_PUBLIC_ANILIST_CLIENT_ID }}
      # Pinned, not secret: metadata ships from Aniraku's offline AniList
      # mirror (same DB, no rate limits). Keeps validate/prebuild/build — and
      # therefore the shipped APK — on the same endpoint as the app default.
      EXPO_PUBLIC_ANILIST_GRAPHQL_URL: "https://graphql.aniraku.tech"
      EXPO_PUBLIC_API_BASE_URL: ${{ secrets.EXPO_PUBLIC_API_BASE_URL }}
      EXPO_PUBLIC_MAL_CLIENT_ID: ${{ secrets.EXPO_PUBLIC_MAL_CLIENT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm check

      - run: pnpm lint

      - run: pnpm test

  build:
    name: Build ${{ matrix.label }} APK (${{ github.event.inputs.tag || github.ref_name }})
    runs-on: ubuntu-latest
    # Gate the release pipeline on validation: without this, flipping
    # continue-on-error on the validate job would not block anything.
    needs: validate
    strategy:
      matrix:
        include:
          - arch: arm64-v8a
            label: arm64
          - arch: armeabi-v7a
            label: arm32
          - arch: armeabi-v7a,arm64-v8a,x86_64
            label: universal
    steps:
      - uses: actions/checkout@v4

      - name: Verify release tag matches app version
        run: |
          APP_VERSION=$(grep -oE 'version: "[0-9]+\.[0-9]+\.[0-9]+"' app.config.ts | head -1 | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
          echo "App version: $APP_VERSION | Release tag: $RELEASE_TAG"
          test "v$APP_VERSION" = "$RELEASE_TAG" || { echo "ERROR: tag $RELEASE_TAG does not match app version $APP_VERSION in app.config.ts"; exit 1; }

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - run: pnpm install --frozen-lockfile

      - name: Prebuild Android project
        run: npx expo prebuild --platform android --clean
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          EXPO_PUBLIC_ANILIST_CLIENT_ID: ${{ secrets.EXPO_PUBLIC_ANILIST_CLIENT_ID }}
          EXPO_PUBLIC_ANILIST_GRAPHQL_URL: "https://graphql.aniraku.tech"
          EXPO_PUBLIC_API_BASE_URL: ${{ secrets.EXPO_PUBLIC_API_BASE_URL }}
          EXPO_PUBLIC_MAL_CLIENT_ID: ${{ secrets.EXPO_PUBLIC_MAL_CLIENT_ID }}

      - name: Build APK (${{ matrix.label }})
        run: |
          cd android
          ./gradlew assembleRelease \
            -PreactNativeArchitectures=${{ matrix.arch }} \
            -PnewArchEnabled=false \
            --no-daemon
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          EXPO_PUBLIC_ANILIST_CLIENT_ID: ${{ secrets.EXPO_PUBLIC_ANILIST_CLIENT_ID }}
          EXPO_PUBLIC_ANILIST_GRAPHQL_URL: "https://graphql.aniraku.tech"
          EXPO_PUBLIC_API_BASE_URL: ${{ secrets.EXPO_PUBLIC_API_BASE_URL }}
          EXPO_PUBLIC_MAL_CLIENT_ID: ${{ secrets.EXPO_PUBLIC_MAL_CLIENT_ID }}

      - name: Rename APK
        run: |
          APK=$(find android/app/build/outputs/apk/release -name "*.apk" | head -1)
          cp "$APK" "aniraku-${RELEASE_TAG}-${{ matrix.label }}.apk"
          echo "Built: aniraku-${RELEASE_TAG}-${{ matrix.label }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: aniraku-${{ matrix.label }}
          path: aniraku-${{ env.RELEASE_TAG }}-${{ matrix.label }}.apk

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: ./artifacts
          merge-multiple: true

      - name: List APKs
        run: ls -lh ./artifacts/*.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Aniraku ${{ env.RELEASE_TAG }}
          draft: false
          prerelease: false
          body: |
            ## v5.7.5 — Watch History, Saved progress & import reconciliation

            Three builds for full coverage (Android 9+). The universal APK contains all architectures.

            - `aniraku-v5.7.5-arm64.apk`
            - `aniraku-v5.7.5-arm32.apk`
            - `aniraku-v5.7.5-universal.apk`

            ### Fixed
            - **Watch History ordering after imports**: History and Continue Watching now order by the row's watch `timestamp` instead of `updated_at`. Import backdates `timestamp` to the real watch window but stamps `updated_at` with import time, so a bulk import used to flood the top of your history with titles you never watched that day.
            - **History no longer renders one row per episode**: the History tab and the Home Continue Watching rail show one row/card per title (the most recent watch) — an imported 148-episode title can no longer bury the list. Long-pressing a history row removes that title's whole episode history, and the confirm dialog says so.
            - **Import immediately refreshes History**: running an Import updates History, resume rails, and Saved progress the moment it lands.
            - **Saved episode totals render at all**: Saved rows read the bookmark's real `total_episodes` field (a field typo kept `N EP` hidden).

            ### Added
            - **Saved progress**: Saved rows and grid cards show real progress — `6/12 EP` — from distinct episodes ≥80% watched (the same rule the status auto-advance uses, so badge and progress can never disagree).
            - **Reconciliation surfaced**: import results show the backend's "N stale episode rows trimmed", so a fixing import visibly heals your account.
            - **Docs updated** for the reconciling semantics: import syncs local progress exactly to the provider (stale rows trimmed, real watches untouched, existing ratings kept); export writes your current status and only the episodes you actually watched (Plan to Watch exports 0 episodes).

            ### Changed
            - **App icon URL** now points at this repository's `assets/images/icon.png` on GitHub raw instead of Manus platform storage.
            - **Android versionCode**: 72.

            ### Housekeeping
            - 255 tests green (8 new); tsc clean; ESLint 0 errors / 69 warnings (at baseline).

            Download the APK, install, and allow *install from unknown sources* if prompted.
          files: ./artifacts/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
