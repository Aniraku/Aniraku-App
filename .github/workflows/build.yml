name: Build & Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build (must match the version in app.config.ts)"
        required: false
        default: "v5.8.0"

env:
  RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate (typecheck, lint, tests)
    runs-on: ubuntu-latest
    # Blocking validate gate: typecheck, lint, and tests must pass before the
    # APK build starts (see `needs: validate` on the build job). Verified for
    # Phase I:
    #   - `pnpm install --frozen-lockfile` ✔ (lockfile re-synced after dropping expo-video)
    #   - `pnpm check` ✔ (tsc clean)
    #   - `pnpm lint` ✔ (ESLint 9 config fixed: eslint.config.mjs; 0 errors)
    #   - `pnpm test` ✔ (tests/aniraku-services + aniraku-avatars now skip when
    #     EXPO_PUBLIC_* env is absent; with the secrets below they run as live
    #     smoke probes, so a production endpoint outage will also fail validation)
    continue-on-error: false
    # Live-configuration secrets: with these set, the suite asserts real
    # Supabase/AniList endpoints; without them, those tests skip gracefully.
    env:
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
      EXPO_PUBLIC_ANILIST_CLIENT_ID: ${{ secrets.EXPO_PUBLIC_ANILIST_CLIENT_ID }}
      # Pinned, not secret: metadata ships from Aniraku's offline AniList
      # mirror (same DB, no rate limits). Keeps validate/prebuild/build — and
      # therefore the shipped APK — on the same endpoint as the app default.
      EXPO_PUBLIC_ANILIST_GRAPHQL_URL: "https://graphql.aniraku.tech"
      EXPO_PUBLIC_API_BASE_URL: ${{ secrets.EXPO_PUBLIC_API_BASE_URL }}
      EXPO_PUBLIC_MAL_CLIENT_ID: ${{ secrets.EXPO_PUBLIC_MAL_CLIENT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm check

      - run: pnpm lint

      # Deterministic suite is the blocking release gate.
      - run: pnpm test -- --exclude tests/aniraku-services.test.ts

      # Live production-health probe: advisory only, never blocks a release.
      # It fetches the real backend from the CI runner, which sits behind
      # Cloudflare — datacenter IPs get challenged/blocked even when the origin
      # is healthy — so it's hostage to CDN IP policy, not backend health. A red
      # run here is a signal to check the backend, not a reason to hold the APK.
      - run: pnpm test -- tests/aniraku-services.test.ts
        continue-on-error: true

  build:
    name: Build ${{ matrix.label }} APK (${{ github.event.inputs.tag || github.ref_name }})
    runs-on: ubuntu-latest
    # Gate the release pipeline on validation: without this, flipping
    # continue-on-error on the validate job would not block anything.
    needs: validate
    strategy:
      matrix:
        include:
          - arch: arm64-v8a
            label: arm64
          - arch: armeabi-v7a
            label: arm32
          - arch: armeabi-v7a,arm64-v8a,x86_64
            label: universal
    steps:
      - uses: actions/checkout@v4

      - name: Verify release tag matches app version
        run: |
          APP_VERSION=$(grep -oE 'version: "[0-9]+\.[0-9]+\.[0-9]+"' app.config.ts | head -1 | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
          echo "App version: $APP_VERSION | Release tag: $RELEASE_TAG"
          test "v$APP_VERSION" = "$RELEASE_TAG" || { echo "ERROR: tag $RELEASE_TAG does not match app version $APP_VERSION in app.config.ts"; exit 1; }

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - run: pnpm install --frozen-lockfile

      - name: Prebuild Android project
        run: npx expo prebuild --platform android --clean
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          EXPO_PUBLIC_ANILIST_CLIENT_ID: ${{ secrets.EXPO_PUBLIC_ANILIST_CLIENT_ID }}
          EXPO_PUBLIC_ANILIST_GRAPHQL_URL: "https://graphql.aniraku.tech"
          EXPO_PUBLIC_API_BASE_URL: ${{ secrets.EXPO_PUBLIC_API_BASE_URL }}
          EXPO_PUBLIC_MAL_CLIENT_ID: ${{ secrets.EXPO_PUBLIC_MAL_CLIENT_ID }}

      - name: Restore stable release keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/aniraku-release.keystore

      - name: Patch release signing + ABI (${{ matrix.label }})
        run: |
          bash scripts/patch-release-signing.sh "aniraku-release.keystore"
          bash scripts/patch-build-abi.sh "${{ matrix.arch }}"
        env:
          ANIRAKU_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANIRAKU_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANIRAKU_KEY_ALIAS: aniraku

      - name: Build APK (${{ matrix.label }})
        run: |
          cd android
          ./gradlew assembleRelease \
            -PreactNativeArchitectures=${{ matrix.arch }} \
            -PnewArchEnabled=false \
            --no-daemon
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          EXPO_PUBLIC_ANILIST_CLIENT_ID: ${{ secrets.EXPO_PUBLIC_ANILIST_CLIENT_ID }}
          EXPO_PUBLIC_ANILIST_GRAPHQL_URL: "https://graphql.aniraku.tech"
          EXPO_PUBLIC_API_BASE_URL: ${{ secrets.EXPO_PUBLIC_API_BASE_URL }}
          EXPO_PUBLIC_MAL_CLIENT_ID: ${{ secrets.EXPO_PUBLIC_MAL_CLIENT_ID }}

      - name: Rename APK
        run: |
          APK=$(find android/app/build/outputs/apk/release -name "*.apk" | head -1)
          cp "$APK" "aniraku-${RELEASE_TAG}-${{ matrix.label }}.apk"
          echo "Built: aniraku-${RELEASE_TAG}-${{ matrix.label }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: aniraku-${{ matrix.label }}
          path: aniraku-${{ env.RELEASE_TAG }}-${{ matrix.label }}.apk

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: ./artifacts
          merge-multiple: true

      - name: List APKs
        run: ls -lh ./artifacts/*.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Aniraku ${{ env.RELEASE_TAG }}
          draft: false
          prerelease: false
          body: |
            ## v5.8.1 — Hotfix: watch-screen crash + diagnosable error screen

            Three builds for full coverage (Android 9+). The universal APK contains all architectures. **Installs directly over v5.8.0 — same signing key, no uninstall needed.**

            - `aniraku-v5.8.1-arm64.apk` — modern (64-bit) devices
            - `aniraku-v5.8.1-arm32.apk` — older / budget (32-bit) devices
            - `aniraku-v5.8.1-universal.apk` — every device

            ### Fixed
            - **Watch screen crash**: some v5.8.0 installs hit "Text strings must be rendered within a <Text> component" when the episode list opened, killing the watch screen. The episode number was rendered as a bare number outside a Text component — fixed.

            ### Added
            - **Diagnosable error screen**: the "Aniraku needs to restart this screen" view now has a SHOW DETAILS toggle revealing the exact component stack. If anything ever crashes, tap it and send the screenshot — the bug gets pinpointed instantly.

            ### Carried from v5.8.0 (unchanged)
            - In-app offline downloads (per-quality, native pipeline, offline playback)
            - New-episode push notifications and real per-ABI APK builds
            - The playback-header fix for proxied streams + effective edge caching
            - Parallel segment pool (beta), Terms & Privacy consent gate, account data export

            ### Note for v5.7.9-and-older users
            Releases older than v5.8.0 were signed with per-build debug keys — uninstall the old app once before installing this one. From v5.8.0 onward all updates install in place.
          files: ./artifacts/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
