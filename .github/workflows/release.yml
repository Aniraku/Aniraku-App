name: Aniraku v4.8.2 Stable Release

on:
  push:
    tags:
      - "v4.8.*"
  workflow_dispatch:
    inputs:
      buildType:
        description: "Build type"
        required: true
        default: "release"
        type: choice
        options:
          - release
          - preview

permissions:
  contents: write

jobs:
  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check

  build-apk:
    name: Build Android APK
    needs: typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Expo CLI
        run: pnpm install -g eas-cli

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate native android project
        run: pnpm expo prebuild --platform android --clean

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build APK (Release)
        working-directory: android
        run: ./gradlew assembleRelease

      - name: Verify universal APK (must contain both 32-bit and 64-bit ABIs)
        run: |
          APK="android/app/build/outputs/apk/release/app-release.apk"
          echo "=== Checking APK for required ABIs ==="
          UNZIP_OUTPUT=$(unzip -l "$APK" 2>/dev/null || true)
          HAS_ARM64=$(echo "$UNZIP_OUTPUT" | grep -c "arm64-v8a" || true)
          HAS_ARMEABI=$(echo "$UNZIP_OUTPUT" | grep -c "armeabi-v7a" || true)
          echo "arm64-v8a libraries: $HAS_ARM64"
          echo "armeabi-v7a libraries: $HAS_ARMEABI"
          if [ "$HAS_ARM64" -lt 1 ] || [ "$HAS_ARMEABI" -lt 1 ]; then
            echo "ERROR: APK is missing one or both ABIs. This will crash on 32-bit devices like MediaTek Helio G35."
            echo "Required: arm64-v8a (64-bit) AND armeabi-v7a (32-bit)"
            exit 1
          fi
          echo "APK is universal — both ABIs present."

      - name: Sign APK
        if: env.KEYSTORE_BASE64 != ''
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > /tmp/release.keystore
          jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 \
            -keystore /tmp/release.keystore \
            -storepass "$KEYSTORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            app/build/outputs/apk/release/app-release.apk \
            "$KEY_ALIAS"
          rm /tmp/release.keystore

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: aniraku-v4.8.2-release
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30

  create-release:
    name: Create GitHub Release
    needs: build-apk
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4

      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: aniraku-v4.8.2-release

      - name: Get version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "Aniraku v${{ steps.version.outputs.VERSION }} Stable"
          body: |
            ## Aniraku v${{ steps.version.outputs.VERSION }}

            ### What's New
            - Auto-playing YouTube trailer on anime detail pages
            - Sleep timer for bedtime viewing
            - Airing schedule countdown
            - Deep link sharing (opens in-app)
            - Built-in legal documents and open source licenses
            - Light/dark/system theme toggle
            - Push notification support
            - Advanced search filters (genre, status, format, season, year)
            - Continue Watching rail on home screen
            - Double-tap to seek (±10s) in player

            ### Install
            Download the APK below and install on your Android device.
            Enable "Install from unknown sources" if prompted.

            ### Requirements
            - Android 9.0+ (API 28)
            - ARM64 or ARMv7a
          files: app-release.apk
          draft: false
          prerelease: false
