name: Aniraku V5 Stable Release

on:
  push:
    tags:
      - "v5*"
  workflow_dispatch:
    inputs:
      buildType:
        description: "Build type"
        required: true
        default: "release"
        type: choice
        options:
          - release
          - preview

permissions:
  contents: write

jobs:
  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check

  build-apk:
    name: Build Android APK
    needs: typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Expo CLI
        run: pnpm install -g eas-cli

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate native android project
        run: pnpm expo prebuild --platform android --clean

      - name: Force universal APK (both ABIs)
        run: bash scripts/force-universal-apk.sh

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build APK (Release)
        working-directory: android
        run: ./gradlew assembleRelease

      - name: Verify universal APK (must contain both 32-bit and 64-bit ABIs)
        run: |
          APK="android/app/build/outputs/apk/release/app-release.apk"
          echo "=== APK size ==="
          ls -lh "$APK"
          echo "=== Checking APK for required ABIs ==="
          UNZIP_OUTPUT=$(unzip -l "$APK" 2>/dev/null || true)
          HAS_ARM64=$(echo "$UNZIP_OUTPUT" | grep -c "arm64-v8a" || true)
          HAS_ARMEABI=$(echo "$UNZIP_OUTPUT" | grep -c "armeabi-v7a" || true)
          echo "arm64-v8a libraries: $HAS_ARM64"
          echo "armeabi-v7a libraries: $HAS_ARMEABI"
          if [ "$HAS_ARM64" -lt 1 ] || [ "$HAS_ARMEABI" -lt 1 ]; then
            echo ""
            echo "!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!"
            echo "ERROR: APK is MISSING one or both ABIs!"
            echo "This WILL crash on 32-bit devices (MediaTek Helio G35)."
            echo "Required: arm64-v8a (64-bit) AND armeabi-v7a (32-bit)"
            echo "!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!"
            exit 1
          fi
          echo "APK is universal — both ABIs present."

      - name: Sign APK
        if: env.KEYSTORE_BASE64 != ''
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > /tmp/release.keystore
          jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 \
            -keystore /tmp/release.keystore \
            -storepass "$KEYSTORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            app/build/outputs/apk/release/app-release.apk \
            "$KEY_ALIAS"
          rm /tmp/release.keystore

      - name: Rename APK to aniraku-V5.apk
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk android/app/build/outputs/apk/release/aniraku-V5.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: aniraku-v5-release
          path: android/app/build/outputs/apk/release/aniraku-V5.apk
          retention-days: 30

  create-release:
    name: Create GitHub Release
    needs: build-apk
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.buildType == 'release')
    steps:
      - uses: actions/checkout@v4

      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: aniraku-v5-release

      - name: Get version from tag
        id: version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "VERSION=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
            echo "TAG=${GITHUB_REF#refs/}" >> "$GITHUB_OUTPUT"
          else
            echo "VERSION=5.0.0" >> "$GITHUB_OUTPUT"
            echo "TAG=v5.0.0" >> "$GITHUB_OUTPUT"
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.TAG }}
          name: "Aniraku V5 Stable"
          body: |
            ## Aniraku V5

            ### What's New in V5
            - Full 3D landing page with perspective transforms
            - Auto-playing YouTube trailer on anime detail pages
            - Sleep timer for bedtime viewing
            - Airing schedule countdown
            - Deep link sharing (opens in-app)
            - Built-in legal documents and open source licenses
            - Push notification support
            - Advanced search filters (genre, status, format, season, year)
            - Continue Watching rail on home screen
            - Double-tap to seek (±10s) in player
            - Universal APK — works on all ARM devices (32-bit + 64-bit)

            ### Install
            Download **aniraku-V5.apk** and install on your Android device.
            Enable "Install from unknown sources" if prompted.

            ### Requirements
            - Android 9.0+ (API 28)
            - ARM64 or ARMv7a (universal build)
          files: aniraku-V5.apk
          draft: false
          prerelease: false
