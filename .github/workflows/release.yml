name: Aniraku V5.1 Stable Release

on:
  push:
    tags:
      - "v5*"
  workflow_dispatch:
    inputs:
      buildType:
        description: "Build type"
        required: true
        default: "release"
        type: choice
        options:
          - release
          - preview

permissions:
  contents: write

jobs:
  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check

  build-apk:
    name: Build ${{ matrix.abi }} APK
    needs: typecheck
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - abi: arm64-v8a
            label: arm64
            artifact: aniraku-V5.1-arm64.apk
          - abi: armeabi-v7a
            label: arm32
            artifact: aniraku-V5.1-arm32.apk
    env:
      EXPO_PUBLIC_API_BASE_URL: https://api.aniraku.tech
      EXPO_PUBLIC_ANILIST_GRAPHQL_URL: https://graphql.anilist.co
      EXPO_PUBLIC_SUPABASE_URL: https://sbjdrjaovcgvttfnpfsz.supabase.co
      EXPO_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_-Ht3PZpNy_a35hOI8w1G8g_vwOhAPgS
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate native android project
        run: pnpm expo prebuild --platform android --clean

      - name: Patch build.gradle for ${{ matrix.abi }}
        run: bash scripts/patch-build-abi.sh ${{ matrix.abi }}

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build APK (Release)
        working-directory: android
        run: ./gradlew assembleRelease

      - name: Verify APK contains ONLY ${{ matrix.abi }}
        run: |
          APK="android/app/build/outputs/apk/release/app-release.apk"
          echo "=== APK size ==="
          ls -lh "$APK"
          echo "=== ABI check ==="
          UNZIP=$(unzip -l "$APK" 2>/dev/null || true)
          echo "$UNZIP" | grep -c "${{ matrix.abi }}" || true
          HAS_WRONG=""
          if [ "${{ matrix.abi }}" != "armeabi-v7a" ]; then
            HAS_WRONG=$(echo "$UNZIP" | grep -c "armeabi-v7a" || true)
          fi
          if [ "${{ matrix.abi }}" != "arm64-v8a" ]; then
            WRONG2=$(echo "$UNZIP" | grep -c "arm64-v8a" || true)
            HAS_WRONG=$((HAS_WRONG + WRONG2))
          fi
          if [ "$HAS_WRONG" -gt 0 ]; then
            echo "WARNING: APK contains wrong ABIs alongside ${{ matrix.abi }}"
          fi
          echo "APK verified for ${{ matrix.abi }}"

      - name: Rename APK
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk \
             android/app/build/outputs/apk/release/${{ matrix.artifact }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: android/app/build/outputs/apk/release/${{ matrix.artifact }}
          retention-days: 30

  create-release:
    name: Create GitHub Release
    needs: build-apk
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.buildType == 'release')
    steps:
      - uses: actions/checkout@v4

      - name: Download arm64 APK
        uses: actions/download-artifact@v4
        with:
          name: aniraku-V5.1-arm64.apk

      - name: Download arm32 APK
        uses: actions/download-artifact@v4
        with:
          name: aniraku-V5.1-arm32.apk

      - name: Move APKs into place
        run: |
          ls -lh *.apk 2>/dev/null || ls -lh aniraku-V5.1-arm64.apk/ aniraku-V5.1-arm32.apk/
          mkdir -p release
          cp aniraku-V5.1-arm64.apk/*.apk release/aniraku-V5.1-arm64.apk 2>/dev/null || cp aniraku-V5.1-arm64.apk release/aniraku-V5.1-arm64.apk 2>/dev/null || true
          cp aniraku-V5.1-arm32.apk/*.apk release/aniraku-V5.1-arm32.apk 2>/dev/null || cp aniraku-V5.1-arm32.apk release/aniraku-V5.1-arm32.apk 2>/dev/null || true
          ls -lh release/

      - name: Get version from tag
        id: version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "VERSION=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
            echo "TAG=${GITHUB_REF#refs/}" >> "$GITHUB_OUTPUT"
          else
            echo "VERSION=5.0.0" >> "$GITHUB_OUTPUT"
            echo "TAG=v5.1.0" >> "$GITHUB_OUTPUT"
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.TAG }}
          name: ".Restracted ${{ steps.version.outputs.TAG }} — dual architecture"
          body: |
            ## Aniraku ${{ steps.version.outputs.TAG }}

            > *"Every screen deserves to play."*

            a quiet fix for the voices that were silenced.

            ---

            ### what changed
            - env vars restored — Supabase + AniList keys baked into the build
            - dual architecture builds — arm64 for modern phones, arm32 for older devices
            - gradle.properties newline fix — silent config corruption resolved

            ### install

            | device type | download |
            |---|---|
            | modern phones (2017+) | `aniraku-V5.1-arm64.apk` |
            | older 32-bit (Oppo A16, Helio G35) | `aniraku-V5.1-arm32.apk` |

            enable **install from unknown sources** if prompted.

            ### requirements
            - android 9.0+
            - pick the right APK for your device

            ---

            *not affiliated with any streaming service.*
            *if it helps, consider supporting development on [Patreon](https://patreon.com/ShoIslam).*
          files: release/aniraku-V5.1-arm64.apk,release/aniraku-V5.1-arm32.apk
          draft: false
          prerelease: true
